<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stillpoint Dev Hub</title>
<style>
  :root {
    color-scheme: dark;
    --bg-panel: #0b0b10;
    --bg-elevated: #0a0a0c;
    --surface: rgba(255,255,255,0.05);
    --surface-hover: rgba(255,255,255,0.08);
    --surface-active: rgba(255,255,255,0.11);
    --fg: #EDEDEF;
    --fg-muted: #8A8F98;
    --accent: #5E6AD2;
    --border: rgba(255,255,255,0.06);
    --border-accent: rgba(94,106,210,0.30);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 40px; overflow: hidden;
    background: var(--bg-panel);
    font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--fg);
    -webkit-app-region: drag;
    user-select: none;
  }
  #bar {
    display: flex; align-items: stretch; height: 40px;
    border-bottom: 1px solid var(--border);
  }
  /* macOS traffic-light gutter */
  #gutter { width: 78px; flex: 0 0 auto; }
  #nav {
    display: flex; align-items: center; gap: 2px; padding: 0 4px;
    -webkit-app-region: no-drag;
  }
  .navbtn {
    width: 26px; height: 26px; border-radius: 6px; border: none;
    background: transparent; color: var(--fg-muted); cursor: pointer;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .navbtn:hover { background: var(--surface-hover); color: var(--fg); }
  #tabs {
    flex: 1 1 auto; display: flex; align-items: stretch; overflow-x: auto;
    -webkit-app-region: no-drag;
    scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px;
    max-width: 220px; min-width: 120px; padding: 0 8px 0 12px;
    border-right: 1px solid var(--border);
    color: var(--fg-muted); cursor: pointer;
    white-space: nowrap; overflow: hidden;
  }
  .tab:hover { background: var(--surface-hover); }
  .tab.active { background: var(--surface-active); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
  .tab-close {
    flex: 0 0 auto; width: 16px; height: 16px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-muted); font-size: 12px;
  }
  .tab-close:hover { background: var(--surface); color: var(--fg); }
  #newtab {
    flex: 0 0 auto; width: 30px; display: flex; align-items: center;
    justify-content: center; color: var(--fg-muted); cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #newtab:hover { color: var(--fg); }
</style>
</head>
<body>
  <div id="bar">
    <div id="gutter"></div>
    <div id="nav">
      <button class="navbtn" id="back" title="Back">&#8592;</button>
      <button class="navbtn" id="forward" title="Forward">&#8594;</button>
      <button class="navbtn" id="home" title="Dev Hub (Home)">&#8962;</button>
      <button class="navbtn" id="reload" title="Reload">&#8635;</button>
    </div>
    <div id="tabs"></div>
    <div id="newtab" title="New Tab (Cmd/Ctrl+T)">+</div>
  </div>
  <script>
    const tabsEl = document.getElementById('tabs');
    let lastPayload = { activeId: null, tabs: [] };

    function render(payload) {
      lastPayload = payload;
      tabsEl.innerHTML = '';
      for (const tab of payload.tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.id === payload.activeId ? ' active' : '');
        el.title = tab.url || '';
        el.onclick = (e) => {
          if (e.target.closest('.tab-close')) return;
          window.shellAPI.switchTab(tab.id);
        };
        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = tab.title || 'Loading…';
        const close = document.createElement('span');
        close.className = 'tab-close';
        close.textContent = '×';
        close.onclick = (e) => { e.stopPropagation(); window.shellAPI.closeTab(tab.id); };
        el.appendChild(title);
        el.appendChild(close);
        tabsEl.appendChild(el);
      }
    }

    window.shellAPI.onTabsChanged(render);
    document.getElementById('newtab').onclick = () => window.shellAPI.newTab();
    document.getElementById('back').onclick = () => window.shellAPI.goBack();
    document.getElementById('forward').onclick = () => window.shellAPI.goForward();
    document.getElementById('home').onclick = () => window.shellAPI.goHome();
    document.getElementById('reload').onclick = () => window.shellAPI.reloadActive();
  </script>
</body>
</html>
