DESIGN DECISIONS FROM THE USER (apply to all future phases):

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stillpoint</title>
  <style>
    /* ─── RESET & CANVAS ────────────────────────────────────────────────── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    canvas {
      border: 1px solid #1a1a2e;
      image-rendering: pixelated;
      display: block;
      /* Actual on-screen size is set from JS (resizeCanvasToFit in game.js)
         so the 800x450 internal resolution scales to fill the viewport
         while keeping its aspect ratio, in windowed AND fullscreen mode. */
    }

    /* ─── FULLSCREEN BUTTON ──────────────────────────────────────────── */
    #fullscreen-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(10, 10, 15, 0.75);
      border: 1px solid #2a2a3e;
      color: #4a4a6e;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      z-index: 10;
      pointer-events: auto;
      border-radius: 2px;
      backdrop-filter: blur(2px);
    }
    #fullscreen-btn:hover {
      background: rgba(196, 181, 253, 0.12);
      border-color: #6a6a9e;
      color: #c4b5fd;
    }

    /* ─── UNSTUCK BUTTON (kept as HTML for clickability) ──────────────── */
    #unstuck-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(10, 10, 15, 0.75);
      border: 1px solid #2a2a3e;
      color: #4a4a6e;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      z-index: 10;
      pointer-events: auto;
      border-radius: 2px;
      backdrop-filter: blur(2px);
    }
    #unstuck-btn:hover {
      background: rgba(196, 181, 253, 0.12);
      border-color: #6a6a9e;
      color: #c4b5fd;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <!-- Unstuck button — kept as HTML for clickability -->
  <button id="unstuck-btn" title="Teleport to safe location (U)">⚑ Unstuck</button>

  <!-- Fullscreen toggle — kept as HTML for clickability (also bound to F key) -->
  <button id="fullscreen-btn" title="Toggle fullscreen (F)">⛶ Fullscreen</button>

  <!-- ─── SCRIPTS ────────────────────────────────────────────────────────── -->
  <script src="audio.js"></script>
  <script src="input.js"></script>
  <script src="area.js"></script>
  <script src="map.js"></script>
  <script src="ability.js"></script>
  <script src="boss.js"></script>
  <script src="enemy.js"></script>
  <script src="player.js"></script>
  <script src="game.js"></script>
</body>
</html>
