<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stillpoint — Debug</title>
  <style>
    body { background: #0a0a0f; color: #c4b5fd; font-family: monospace; padding: 20px; }
    #errors { background: #1a0a0a; border: 1px solid #f87171; padding: 10px; margin: 10px 0; min-height: 40px; }
    #log    { background: #0a1a0a; border: 1px solid #2dd4bf; padding: 10px; margin: 10px 0; }
    .err { color: #f87171; } .ok { color: #2dd4bf; }
  </style>
</head>
<body>
<h2>Stillpoint — Script Loader Diagnostics</h2>
<div id="errors">No errors captured yet...</div>
<div id="log">Loading...</div>
<canvas id="game" width="800" height="450" style="border:1px solid #333; display:block; margin-top:20px;"></canvas>

<script>
const errDiv = document.getElementById('errors');
const logDiv  = document.getElementById('log');
let errorCount = 0;

window.onerror = function(msg, src, line, col, err) {
  errorCount++;
  errDiv.innerHTML += `<div class="err">[ERROR ${errorCount}] ${msg}<br>File: ${src} Line: ${line}:${col}</div>`;
  return false;
};

window.addEventListener('unhandledrejection', e => {
  errDiv.innerHTML += `<div class="err">[PROMISE ERROR] ${e.reason}</div>`;
});

function log(msg, ok) {
  logDiv.innerHTML += `<div class="${ok?'ok':'err'}">${msg}</div>`;
}
</script>

<!-- Load scripts in exact same order as index.html -->
<script src="audio.js"  onerror="log('FAILED: audio.js')"></script>
<script>log('audio.js ✓', true);</script>

<script src="input.js"  onerror="log('FAILED: input.js')"></script>
<script>log('input.js ✓', true);</script>

<script src="area.js"   onerror="log('FAILED: area.js')"></script>
<script>
  if (typeof AREAS !== 'undefined') {
    log('area.js ✓  — Areas: ' + Object.keys(AREAS).join(', '), true);
  } else {
    log('area.js loaded but AREAS is undefined!');
  }
</script>

<script src="map.js"    onerror="log('FAILED: map.js')"></script>
<script>log('map.js ✓', true);</script>

<script src="ability.js" onerror="log('FAILED: ability.js')"></script>
<script>log('ability.js ✓', true);</script>

<script src="boss.js"   onerror="log('FAILED: boss.js')"></script>
<script>
  if (typeof FracturedKing !== 'undefined') {
    log('boss.js ✓', true);
  } else {
    log('boss.js loaded but FracturedKing is undefined!');
  }
</script>

<script src="enemy.js"  onerror="log('FAILED: enemy.js')"></script>
<script>log('enemy.js ✓', true);</script>

<script src="player.js" onerror="log('FAILED: player.js')"></script>
<script>
  if (typeof Player !== 'undefined') {
    log('player.js ✓', true);
  } else {
    log('player.js loaded but Player is undefined!');
  }
</script>

<script src="game.js"   onerror="log('FAILED: game.js')"></script>
<script>
  log('game.js ✓ — gameState: ' + (typeof gameState !== 'undefined' ? gameState : 'UNDEFINED'), typeof gameState !== 'undefined');
  if (errorCount === 0) {
    document.getElementById('errors').innerHTML = '<span class="ok">No errors! If game is still black, check canvas rendering below.</span>';
  }
</script>

</body>
</html>
